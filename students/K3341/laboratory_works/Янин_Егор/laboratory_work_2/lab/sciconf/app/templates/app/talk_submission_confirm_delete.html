<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f9fa">
    <title>Удаление заявки — SciConf</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
    {% include "app/partials/header.html" %}
    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <section class="card border-0 shadow-sm w-100" style="max-width: 34rem;">
            <div class="card-body p-4 p-md-5">
                <span class="text-danger text-uppercase fw-semibold small">Удаление заявки</span>
                <h1 class="h3 mt-2">Удалить выступление?</h1>
                <p class="text-body-secondary">
                    Заявка «{{ submission.title }}» для конференции
                    «{{ submission.conference.name }}» будет удалена без возможности восстановления.
                </p>
                <form method="post" class="d-flex flex-wrap gap-2 mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                    <a class="btn btn-outline-secondary"
                       href="{% url 'conference_detail' submission.conference_id %}">Отмена</a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
