<header class="container d-flex flex-wrap justify-content-between align-items-center gap-3 py-3">
    <a class="d-inline-flex align-items-center gap-2 text-decoration-none text-dark fw-bold fs-5"
       href="{% url 'conference_list' %}" aria-label="SciConf — главная">
        <span class="badge rounded-3 text-bg-primary p-2">S</span>
        <span>SciConf</span>
    </a>
    <nav aria-label="Навигация пользователя">
        {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-3">
                <span class="text-body-secondary small">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Выйти</button>
                </form>
            </div>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Войти</a>
        {% endif %}
    </nav>
</header>
