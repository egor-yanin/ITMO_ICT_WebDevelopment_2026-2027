<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Удаление машины</title>
</head>
<body>
	<main>
		<h1>Подтверждение удаления</h1>
		<p>Вы действительно хотите удалить машину «{{ object.gov_number }}»?</p>

		<form method="post">
			{% csrf_token %}
			<button type="submit">Удалить</button>
			<button type="button" onclick="history.back()">Отмена</button>
		</form>
	</main>
</body>
</html>
