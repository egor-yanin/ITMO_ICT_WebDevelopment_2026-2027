<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Владелец</title>
</head>
<body>
	<main>
		<h1>Информация о владельце</h1>
		{% if owner %}
			<dl>
				<dt>ID</dt>
				<dd>{{ owner.id }}</dd>

				<dt>Фамилия</dt>
				<dd>{{ owner.surname }}</dd>

				<dt>Имя</dt>
				<dd>{{ owner.name }}</dd>
                
                <dt>Машины</dt>
                <dd>
                    {% for car in owner.cars.all %}
                        <p>{{ car.brand }} {{ car.model }} ({{ car.year }})</p>
                    {% empty %}
                        <p>У владельца нет машин.</p>
                    {% endfor %}
			</dl>
		{% else %}
			<p>Владелец не найден.</p>
		{% endif %}
	</main>
</body>
</html>
