<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Машины</title>
</head>
<body>
	<main>
		<h1>Машины</h1>
		<ul>
			{% for car in cars %}
				<li>{{ car.color }} {{ car.brand }} {{ car.model }} {{ car.gov_number }}</li>
			{% empty %}
				<li>Не найдено машин.</li>
			{% endfor %}
		</ul>
	</main>
</body>
</html>
