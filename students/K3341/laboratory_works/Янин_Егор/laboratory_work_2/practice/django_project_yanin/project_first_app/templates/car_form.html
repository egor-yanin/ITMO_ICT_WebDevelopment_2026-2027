<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% if form.instance.pk %}Изменить автомобиль{% else %}Добавить автомобиль{% endif %}</title>
</head>
<body>
	<main>
		<h1>{% if form.instance.pk %}Изменить автомобиль{% else %}Добавить автомобиль{% endif %}</h1>

		<form method="post" enctype="multipart/form-data">
			{% csrf_token %}
			{{ form.as_p }}
			<button type="submit">
				{% if form.instance.pk %}Сохранить изменения{% else %}Добавить автомобиль{% endif %}
			</button>
		</form>
	</main>
</body>
</html>
